[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflquant"
version = "0.1.0"
description = "NFL quantitative prediction research platform: leakage-safe features, baseline + ML models, ensemble, possession-level Monte Carlo, rolling-origin backtesting."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "requests>=2.28",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["nflquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

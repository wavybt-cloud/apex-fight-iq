# nflquant default configuration.
# Every run records the resolved config + git commit in runs/ for reproducibility.

data:
  cache_dir: data_cache          # relative to nflquant/ root; gitignored
  games_url: "https://github.com/nflverse/nfldata/raw/master/data/games.csv"
  games_local: "/home/user/nflverse/nfldata/data/games.csv"   # preferred if present
  pbp_url_tpl: "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_{season}.parquet"
  injuries_url_tpl: "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_{season}.parquet"
  pbp_seasons: [2006, 2025]      # inclusive range ingested for EPA features
  ca_bundle: "/root/.ccr/ca-bundle.crt"   # used if the file exists (agent proxy TLS)

seasons:
  first_model_season: 2009       # first season predictions are emitted (3yr PBP burn-in)
  validation: [2019, 2022]       # inclusive; used for ensemble weights + calibration
  test: [2023, 2025]             # untouched until final evaluation

elo:
  k: 20.0
  hfa_points: 48.0               # Elo points, ~1.9 game points (init for dynamic mode)
  preseason_regress: 0.33        # fraction of rating pulled to mean between seasons
  mov_multiplier: true
  rest_points_per_day: 6.0       # Elo pts per day of rest differential vs 7
  qb_change_penalty: 55.0        # Elo pts when listed starter differs from last start
  points_per_elo: 0.0402         # game points per Elo point (25 Elo ≈ 1 pt)
  dynamic_hfa_halflife: 200      # games; walk-forward HFA (dev-neutral, val -.0015 brier)
  # 2026 tuning note: an Optuna sweep of k/rest/qb/regress/static-HFA improved
  # the dev window but DEGRADED validation (HFA regime change) - rejected.
  # Dynamic HFA adopted instead. See runs/tuning_result.json.

features:
  ewma_halflife_games: 4         # offense/pace halflife (2026 tuning: 6 -> 4)
  halflife_def: 14               # defense is noisier - slower halflife
  halflife_to: 40                # turnovers are mostly luck - shrink hard
  min_prior_games: 4             # early-season: blend with previous-season prior
  prior_blend_games: 10          # full weight to current season after this many games
  garbage_time_wp: [0.05, 0.95]  # plays outside this win-prob band = garbage time

qb:
  prior_strength: 100            # dropbacks of prior weight (2026 tuning: 200 -> 100)
  game_decay: 0.95               # per-game evidence decay (0.97 -> 0.95)
  cpoe_weight: 0.0               # CPOE blend rejected by tuning - no dev gain

gbm:
  num_leaves: 31
  learning_rate: 0.03
  n_estimators: 600
  min_child_samples: 40
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  early_stopping_rounds: 60

simulation:
  n_sims: 50000
  drives_mean: 11.2              # per team per game (empirical modern NFL)
  drives_sd: 1.1
  param_sd_pts: 2.4              # per-sim team strength shock (points)
  drive_var_shrink: 0.72         # drive-count variance shrink (serial correlation proxy)
  endgame_tie_prob: 0.35         # 1-3 pt finishes pulled to a tie (late FG chase)
  walkoff_prob: 0.50             # regulation ties resolved by walk-off FG
  consolation_prob: 0.24         # 9-13 pt finishes compressed by a late score
  seed: 20260909
  # constants above were calibrated on the 2019-2022 validation window via
  # nflquant/simulation/diagnostics.py; rerun it before changing any of them

market:
  spread_sigma: 13.45            # empirical sd of (result - spread) 1999-2025, checked in tests
  vig_free: true
